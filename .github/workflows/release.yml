name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.metadata.outputs.ready }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install release-plz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-plz"
          gh release download release-plz-v0.4.1 --repo release-plz/release-plz \
            --pattern release-plz-x86_64-unknown-linux-gnu.tar.gz \
            --dir "$RUNNER_TEMP/release-plz"
          tar -xzf "$RUNNER_TEMP/release-plz/release-plz-x86_64-unknown-linux-gnu.tar.gz" \
            -C "$RUNNER_TEMP/release-plz"
          echo "$RUNNER_TEMP/release-plz" >> "$GITHUB_PATH"
      - name: Prepare version and changelog
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/prepare-release.py
      - name: Create tag and draft release
        if: steps.metadata.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          release-plz release --allow-dirty
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
          # release-plz skips an existing tag; recover an interrupted draft creation.
          if gh release view "$TAG" --json isDraft \
              > "$RUNNER_TEMP/release-response" 2> "$RUNNER_TEMP/release-error"; then
            :
          elif [[ $(< "$RUNNER_TEMP/release-error") == *"release not found"* ]]; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" \
              --notes-file CHANGELOG.md --target "$GITHUB_SHA"
          else
            cat "$RUNNER_TEMP/release-error" >&2
            exit 1
          fi
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
      - name: Save release metadata
        if: steps.metadata.outputs.ready == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-metadata
          path: |
            Cargo.toml
            Cargo.lock
            CHANGELOG.md
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  build:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore release metadata
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-metadata
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --target "$TARGET"
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          linker_variable="CARGO_TARGET_${TARGET^^}_LINKER"
          echo "${linker_variable//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Check release source
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          cargo +stable fmt --check
          cargo +stable check --all-targets --locked
          cargo +stable clippy --all-targets --locked -- -D warnings
          cargo +stable doc --no-deps --locked
      - name: Build release
        run: cargo +stable build --release --locked --target "$TARGET"
      - name: Check binary version
        run: |
          executable="target/$TARGET/release/rkdeveloptool"
          if [[ "$RUNNER_OS" == Windows ]]; then executable+=.exe; fi
          test "$("$executable" --version)" = "rkdeveloptool ver $VERSION"
      - name: Package binary
        id: package
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import tarfile
          import zipfile

          target = os.environ["TARGET"]
          name = f"rkdeveloptool-v{os.environ['VERSION']}-{target}"
          windows = os.environ["RUNNER_OS"] == "Windows"
          staging = Path(os.environ["RUNNER_TEMP"]) / name
          staging.mkdir()
          binary = "rkdeveloptool.exe" if windows else "rkdeveloptool"
          shutil.copy2(Path("target") / target / "release" / binary, staging / binary)
          for filename in ("LICENSE", "README.md", "99-rk-rockusb.rules"):
              shutil.copy2(filename, staging / filename)
          Path("dist").mkdir()
          archive = Path("dist") / (name + (".zip" if windows else ".tar.gz"))
          if windows:
              with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as output:
                  for filename in sorted(staging.iterdir()):
                      output.write(filename, f"{name}/{filename.name}")
          else:
              with tarfile.open(archive, "w:gz") as output:
                  output.add(staging, arcname=name)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"archive={archive.as_posix()}\n")
          PY
      - name: Attest build provenance
        id: attest
        uses: actions/attest@v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}
          create-storage-record: false
      - name: Save attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: cp "$BUNDLE" "$ARCHIVE.sigstore.json"
      - name: Save release assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download release assets
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Download release notes
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-metadata
          path: metadata
      - name: Generate checksums
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          archives = sorted(path for path in Path("dist").iterdir()
                            if path.name.endswith((".tar.gz", ".zip")))
          if len(archives) != 6:
              raise SystemExit(f"Expected six release archives, found {len(archives)}")
          with Path("dist/SHA256SUMS").open("w") as output:
              for archive in archives:
                  if not Path(f"{archive}.sigstore.json").is_file():
                      raise SystemExit(f"Missing attestation bundle for {archive.name}")
                  output.write(f"{hashlib.sha256(archive.read_bytes()).hexdigest()}  {archive.name}\n")
          PY
      - name: Publish immutable release
        run: |
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]]; then
            echo "Release $TAG is already published."
            exit 0
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --notes-file metadata/CHANGELOG.md
          gh release edit "$TAG" --draft=false --latest
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .immutable)" = true
